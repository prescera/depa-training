# Dataset descriptor template (DEPA Training v2, spec section 7.2) for TDP `bank-a`.
#
# Resolved by `depa` with environment substitution of dollar-brace placeholders (NAME, or NAME:-default) before YAML
# parsing; the defaults target the local dev stack (`depa dev up`, file connector).
#   depa dataset create-key   -> creates bank-a/credit-applications#1 in the KMS
#   depa dataset policy set   -> publishes the `policy` section below (owner-signed)
#   depa dataset encrypt      -> encrypts `source` into dedf/1 (manifest.json + manifest.jws + objects/)
#   depa dataset upload       -> copies the encrypted tree to `location`
#   depa dataset publish      -> fills manifest_digest, size_bytes, records and posts to the CS catalog
# `source` and `policy` are SDK-local and are never published.
dataset_id: bank-a/credit-applications
version: "2026-11-01"
name: Bank A credit applications
description: >-
  Current credit applications with default target and derived affordability features (Home Credit, synthetic use).
format: dedf/1
schema:
  type: tabular
  files: ["*.parquet"]
  columns:
    - {name: SK_ID_CURR, type: int64, pii: pseudonymous}
    - {name: TARGET, type: int64, pii: none}
    - {name: INCOME_PER_PERSON, type: float64, pii: none}
    - {name: CREDIT_TO_INCOME, type: float64, pii: none}
    - {name: NAME_CONTRACT_TYPE, type: string, pii: none}
    - {name: CODE_GENDER, type: string, pii: quasi}
    - {name: FLAG_OWN_CAR, type: string, pii: none}
    - {name: FLAG_OWN_REALTY, type: string, pii: none}
    - {name: CNT_CHILDREN, type: int64, pii: quasi}
location:
  connector: ${BANK_A_APPS_CONNECTOR:-file}
  uri: ${BANK_A_APPS_DATA_URI:-file:///tmp/depa-dev-storage/bank-a/credit-applications/2026-11-01/}
  # region: ap-south-1        # required for s3
# How a CCR obtains read access with the KMS-issued OIDC token (spec section 10); trust subject
# `dataset:bank-a/credit-applications`. Not needed for the dev `file` connector. Production examples:
#   aws:   {role_arn: "arn:aws:iam::<account>:role/depa-bank-a-credit-applications-reader"}
#   gcp:   {audience: "//iam.googleapis.com/projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"}
#   azure: {broker_url: "https://<tdp-broker>/api", audience: "api://depa-broker-<tdp>"}  # SAS broker, spec 10.1
#          ({tenant_id, client_id} once the KMS can issue RS256 tokens)
federation: {}
kms:
  url: ${DEPA_KMS_URL:-https://127.0.0.1:18000/app}
  kid: bank-a/credit-applications#1

# --- SDK-local sections (never published) ------------------------------------------------
source:
  # Preprocessed plaintext produced by this scenario's preprocessing step (relative to the
  # scenario directory). Only the listed files are encrypted.
  path: data/bank_a/preprocessed
  include: ["bank_a_app_learn.parquet"]
policy:
  # Release Policy v1 (spec section 7.1). `virtual` is for the local dev stack only and MUST be
  # removed (set BANK_A_APPS_ALLOWED_PLATFORMS) before real data is published.
  version: 1
  allowed_platforms: ${BANK_A_APPS_ALLOWED_PLATFORMS:-[aci-snp, gcp-cs-tdx, virtual]}
  allowed_tiers: [1]
  allowed_tdcs: ["${DEPA_TDC:-tdc}"]
  allowed_purposes: [TRAINING]
  privacy: {require_dp: true, max_epsilon: 7.5, max_delta: 0.01}
  allowed_output_modes: [tdc]
  allowed_audiences: ${BANK_A_APPS_ALLOWED_AUDIENCES:-[sts.amazonaws.com]}
  allowed_custom_measurements: []
  max_runs_per_contract: 10
  not_after: "2027-12-31T00:00:00Z"
