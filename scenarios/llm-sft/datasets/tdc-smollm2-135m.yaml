# Dataset descriptor template (DEPA Training v2, spec section 7.2) for party `tdc`.
#
# Resolved by `depa` with environment substitution of dollar-brace placeholders (NAME, or NAME:-default)
# before YAML parsing; the defaults target the local dev stack (`depa dev up`, file connector).
#   depa dataset create-key / policy set / encrypt / upload / publish  (see sdk/python/README.md)
# `source` and `policy` are SDK-local and are never published.
dataset_id: tdc/smollm2-135m
version: "2026-11-01"
name: SmolLM2-135M base model
description: >-
  The consumer's base model (HuggingFaceTB/SmolLM2-135M, Apache-2.0) supplied as an input dataset: config and tokenizer JSON plus model.safetensors.
format: dedf/1
schema:
  type: model
  files: ["*.json", "model.safetensors"]
location:
  connector: ${LLM_BASE_MODEL_CONNECTOR:-file}
  uri: ${LLM_BASE_MODEL_DATA_URI:-file:///tmp/depa-dev-storage/tdc/smollm2-135m/2026-11-01/}
  # region: ap-south-1        # required for s3
# Read access for a CCR via the KMS-issued OIDC token (spec section 10); trust subject
# `dataset:tdc/smollm2-135m`. Not needed for the dev `file` connector. Production examples:
#   aws:   {role_arn: "arn:aws:iam::<account>:role/depa-tdc-smollm2-135m-reader"}
#   gcp:   {audience: "//iam.googleapis.com/projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"}
#   azure: {broker_url: "https://<broker>/api", audience: "api://depa-broker-tdc"}  # SAS broker, spec 10.1
federation: {}
kms:
  url: ${DEPA_KMS_URL:-https://127.0.0.1:18000/app}
  kid: tdc/smollm2-135m#1

# --- SDK-local sections (never published) ------------------------------------------------
source:
  # Produced by `prepare/prepare.sh --party tdc` (relative to the scenario directory).
  path: data/base_model
  include: ["*.json", "model.safetensors"]
policy:
  # Release Policy v1 (spec section 7.1). `virtual` is for the local dev stack only and MUST be
  # removed (set LLM_BASE_MODEL_ALLOWED_PLATFORMS) before real data is published.
  # The TDC owns this dataset, so the TDC is also a TDP of the contract (and must hold role tdp).
  version: 1
  allowed_platforms: ${LLM_BASE_MODEL_ALLOWED_PLATFORMS:-[aci-snp, gcp-cs-tdx, virtual]}
  allowed_tiers: [1]
  allowed_tdcs: [tdc]
  allowed_purposes: [TRAINING]
  allowed_output_modes: [tdc]
  allowed_audiences: ${LLM_BASE_MODEL_ALLOWED_AUDIENCES:-[sts.amazonaws.com]}
  allowed_custom_measurements: []
  max_runs_per_contract: 10
  not_after: "2027-12-31T00:00:00Z"
