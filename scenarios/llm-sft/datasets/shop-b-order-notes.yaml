# Dataset descriptor template (DEPA Training v2, spec section 7.2) for party `shop-b`.
#
# Resolved by `depa` with environment substitution of dollar-brace placeholders (NAME, or NAME:-default)
# before YAML parsing; the defaults target the local dev stack (`depa dev up`, file connector).
#   depa dataset create-key / policy set / encrypt / upload / publish  (see sdk/python/README.md)
# `source` and `policy` are SDK-local and are never published.
dataset_id: shop-b/order-notes
version: "2026-11-01"
name: Shop B order notes
description: >-
  Synthetic free-text order notes paired with the JSON record they describe ({order_id, quantity, item, city, date}).
format: dedf/1
schema:
  type: text
  files: ["*.jsonl"]
  columns:
    - {name: example_id, type: string, pii: none}
    - {name: prompt, type: string, pii: quasi}
    - {name: completion, type: string, pii: quasi}
location:
  connector: ${LLM_SHOP_B_CONNECTOR:-file}
  uri: ${LLM_SHOP_B_DATA_URI:-file:///tmp/depa-dev-storage/shop-b/order-notes/2026-11-01/}
  # region: ap-south-1        # required for s3
# Read access for a CCR via the KMS-issued OIDC token (spec section 10); trust subject
# `dataset:shop-b/order-notes`. Not needed for the dev `file` connector. Production examples:
#   aws:   {role_arn: "arn:aws:iam::<account>:role/depa-shop-b-order-notes-reader"}
#   gcp:   {audience: "//iam.googleapis.com/projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"}
#   azure: {broker_url: "https://<broker>/api", audience: "api://depa-broker-shop-b"}  # SAS broker, spec 10.1
federation: {}
kms:
  url: ${DEPA_KMS_URL:-https://127.0.0.1:18000/app}
  kid: shop-b/order-notes#1

# --- SDK-local sections (never published) ------------------------------------------------
source:
  # Produced by `prepare/prepare.sh --party shop-b` (relative to the scenario directory).
  path: data/shop_b/preprocessed
  include: ["shop_b_notes.jsonl"]
policy:
  # Release Policy v1 (spec section 7.1). `virtual` is for the local dev stack only and MUST be
  # removed (set LLM_SHOP_B_ALLOWED_PLATFORMS) before real data is published.
  version: 1
  allowed_platforms: ${LLM_SHOP_B_ALLOWED_PLATFORMS:-[aci-snp, gcp-cs-tdx, virtual]}
  allowed_tiers: [1]
  allowed_tdcs: [tdc]
  allowed_purposes: [TRAINING]
  allowed_output_modes: [tdc]
  allowed_audiences: ${LLM_SHOP_B_ALLOWED_AUDIENCES:-[sts.amazonaws.com]}
  allowed_custom_measurements: []
  max_runs_per_contract: 10
  not_after: "2027-12-31T00:00:00Z"
