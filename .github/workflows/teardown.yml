name: Tear down

# Tears down in reverse order of setup, by scope:
#   scenario       Tear down Scenario: revoke the scenario's contracts, delete its model outputs
#                  (collaborators, datasets, keys and DC services stay)
#   collaborators  Tear down Scenario (when a scenario is given), then Tear down Collaborators
#                  (data providers, data consumer, CCR provider)
#   all            the above, then Tear down DC services (KMS, Contract Service, registry)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      scope:
        description: "scenario · collaborators · all"
        type: choice
        options: [scenario, collaborators, all]
        default: all
      scenario:
        description: Scenario to tear down (scenarios/<name>; required for scope scenario, optional otherwise)
        type: string
        default: ""
      platform:
        description: Clean-room platform the scenario ran on
        type: choice
        options: [aks, gcp]
        default: aks
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scope:
        type: string
        default: all
      scenario:
        type: string
        default: ""
      platform:
        type: string
        default: aks
      confirm:
        type: string
        required: true

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      SCOPE: ${{ inputs.scope }}
      SCENARIO: ${{ inputs.scenario }}
      CONFIRMED: ${{ inputs.confirm == inputs.environment }}
    steps:
      - name: Check inputs
        run: |
          [[ "${CONFIRMED}" == true ]] || { echo "::error::confirm must repeat the environment name"; exit 1; }
          [[ "${SCOPE}" =~ ^(scenario|collaborators|all)$ ]] || { echo "::error::scope must be scenario, collaborators or all"; exit 1; }
          if [[ "${SCOPE}" == scenario && -z "${SCENARIO}" ]]; then
            echo "::error::scope scenario needs a scenario"; exit 1
          fi
          [[ -z "${SCENARIO}" || "${SCENARIO}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid scenario name"; exit 1; }

  scenario:
    name: Tear down Scenario
    needs: check
    if: inputs.scenario != ''
    uses: ./.github/workflows/teardown-scenario.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  collaborators:
    name: Tear down Collaborators
    needs: [check, scenario]
    if: ${{ always() && needs.check.result == 'success' && (inputs.scope == 'collaborators' || inputs.scope == 'all') }}
    uses: ./.github/workflows/teardown-collaborators.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  dc-services:
    name: Tear down DC services
    needs: [check, collaborators]
    if: ${{ always() && needs.check.result == 'success' && inputs.scope == 'all' && needs.collaborators.result == 'success' }}
    uses: ./.github/workflows/teardown-dc-services.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
