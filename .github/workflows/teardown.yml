name: Tear down

# Destroys the collaborator resources (2-workloads), then the trusted services infrastructure
# (1-platform) of the single-subscription Azure deployment. Key Vaults are soft-deleted (purge protection) and keep
# their names reserved for the retention period; ledgers, storage, AKS and the registry are deleted.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      confirm:
        type: string
        required: true

permissions: {}

concurrency:
  group: azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy
    if: inputs.confirm == inputs.environment
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      # Collaborator resources first (storage, SAS brokers, virtual nodes release), then the
      # trusted services infrastructure (ledgers, Key Vaults, registry, AKS, resource groups).
      - name: Destroy collaborator resources
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          if terraform -chdir="${DIR}/1-platform" output -json platform >"${RUNNER_TEMP}/platform.json" 2>/dev/null; then
            jq '{platform: .}' "${RUNNER_TEMP}/platform.json" >"${DIR}/2-workloads/platform.auto.tfvars.json"
            # Placeholder: destroy does not use the JWKS.
            jq -n '{kms_jwks_json: ({keys: [{kty: "EC", crv: "P-256", kid: "teardown", x: "", y: ""}]} | tojson)}' \
              >"${DIR}/2-workloads/broker.auto.tfvars.json"
            terraform -chdir="${DIR}/2-workloads" destroy -no-color -auto-approve
          fi
      - name: Destroy trusted services infrastructure
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}
        run: terraform -chdir="${DIR}/1-platform" destroy -no-color -auto-approve
