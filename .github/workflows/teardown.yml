name: Tear down

# Tears down in reverse order of setup: the scenario's collaborators (scope scenario or all),
# then the DC services (scope all only).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      scope:
        description: "scenario: collaborator resources only (DC services stay up) · all: everything"
        type: choice
        options: [scenario, all]
        default: all
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scope:
        type: string
        default: all
      confirm:
        type: string
        required: true

permissions: {}

jobs:
  scenario:
    name: Tear down Scenario
    if: inputs.confirm == inputs.environment && (inputs.scope == 'scenario' || inputs.scope == 'all')
    uses: ./.github/workflows/teardown-scenario.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  dc-services:
    name: Tear down DC services
    needs: scenario
    if: inputs.confirm == inputs.environment && inputs.scope == 'all'
    uses: ./.github/workflows/teardown-dc-services.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
