name: Tear down

# Tears down everything, in reverse order of setup: the scenario's collaborators, then the DC
# services.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      confirm:
        type: string
        required: true

permissions: {}

jobs:
  scenario:
    name: Tear down Scenario
    if: inputs.confirm == inputs.environment
    uses: ./.github/workflows/teardown-scenario.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  dc-services:
    name: Tear down DC services
    needs: scenario
    if: inputs.confirm == inputs.environment
    uses: ./.github/workflows/teardown-dc-services.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
