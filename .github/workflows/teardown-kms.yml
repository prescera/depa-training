name: Tear down KMS

# Destroys the KMS (ledger, Key Vault, network). Demo only: the Key Vault has no purge protection
# and the azurerm provider purges it on destroy, so a fresh deployment can reuse its name at once.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions: {}

concurrency:
  group: tf-${{ inputs.environment }}-kms
  cancel-in-progress: false

jobs:
  destroy:
    name: Tear down KMS
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          component: kms
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: Destroy
        if: steps.tf.outputs.state-exists == 'true'
        env:
          DIR: ${{ steps.tf.outputs.dir }}
        run: |
          terraform -chdir="${DIR}" destroy -no-color -auto-approve
