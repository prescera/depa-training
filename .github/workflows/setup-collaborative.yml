name: Set up collaborative

# The Data Collaborative's trusted services on Azure (single subscription, one resource group per
# party), in three jobs:
#   Trusted services infrastructure  Terraform azure-single-subscription/1-platform: party resource
#                                    groups, KMS and contract-service ledgers (Azure Confidential
#                                    Ledger) with Key Vaults, container registry, Log Analytics and
#                                    the consumer's AKS cluster (needed by phase 2's Kubernetes
#                                    providers).
#   KMS and contract service         builds both bundles from <owner>/depa-training-kms-azure and
#                                    <owner>/contract-service (DEPA_SERVICES_REF), installs them on
#                                    their ledgers and runs the idempotent governance setup
#                                    (bootstrap creates the KMS OIDC key; members, parties).
#   Clean-room releases              per trainer family: image -> registry, CCE policy, release
#                                    manifest (artifact ccr-releases-<environment>-<family>).
# Next: "Set up collaborators".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      apply:
        description: Apply (otherwise plan only)
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        type: boolean
        default: true

permissions: {}

concurrency:
  group: azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Trusted services infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: Check region
        run: deploy/scripts/check-region.sh "${AZURE_LOCATION}" # ACL, Flex Consumption, VN2 confidential pods
      - name: Terraform plan
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}/1-platform
        run: |
          set -o pipefail
          terraform -chdir="${DIR}" plan -no-color -out=tfplan | tee "${RUNNER_TEMP}/plan.txt"
          { echo "### Trusted services infrastructure: terraform plan (1-platform)"; echo '```'; grep -E '^Plan:|No changes' "${RUNNER_TEMP}/plan.txt" || true; echo '```'; } \
            >>"${GITHUB_STEP_SUMMARY}"
      - name: Terraform apply
        if: inputs.apply
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}/1-platform
        run: terraform -chdir="${DIR}" apply -no-color -auto-approve tfplan

  services:
    name: KMS and contract service
    needs: infrastructure
    if: inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Deploy apps to ledgers
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}
        run: |
          # Build the KMS and contract-service bundles; PUT /app/userDefinedEndpoints on each ledger.
          terraform -chdir="${DIR}/1-platform" output -json platform >"${RUNNER_TEMP}/platform.json"
          deploy/scripts/deploy-services.sh --platform-json "${RUNNER_TEMP}/platform.json" \
            --kms-repo .deps/depa-training-kms-azure --cs-repo .deps/contract-service \
            --out-dir "${RUNNER_TEMP}/services"
          { echo '### KMS and contract service bundles'; echo '```json'; cat "${RUNNER_TEMP}/services/services.json"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: Install depa CLI
        run: |
          python -m pip install --require-hashes --no-deps -r ccr/requirements/agent.txt
          python -m pip install --no-deps ./trainers ./sdk/python
      - name: Render environment file
        env:
          DEPA_PARTY_KEYS: ${{ secrets.DEPA_PARTY_KEYS }}
        run: |
          # depa-env.yaml from the Terraform outputs; party keys from the DEPA_PARTY_KEYS secret.
          deploy/scripts/party-keys.sh unpack "${RUNNER_TEMP}/keys"
          mkdir -p "${RUNNER_TEMP}/releases"
          deploy/scripts/render-env.sh --parties-json "${RUNNER_TEMP}/demo-parties.json" \
            --keys-dir "${RUNNER_TEMP}/keys" --releases-dir "${RUNNER_TEMP}/releases" --out "${RUNNER_TEMP}/env/depa-env.yaml"
      - name: Set up governance
        run: depa dc setup --env "${RUNNER_TEMP}/env/depa-env.yaml" # bootstrap, members, parties, settings (idempotent)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dc-services-${{ inputs.environment }}
          path: ${{ runner.temp }}/services/
          if-no-files-found: error

  releases:
    name: Clean-room releases (${{ matrix.family }})
    needs: infrastructure
    if: inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        family: [classic, torch, llm] # credit-risk: classic; mnist, cifar10, covid, brats: torch; llm-sft: llm
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install confcom
        run: az extension add --name confcom --version "$(tr -d '[:space:]' < ccr/policy/confcom.version)" --yes
      - name: Build release
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIR: ${{ steps.azure.outputs.deploy-dir }}
          FAMILY: ${{ matrix.family }}
        run: |
          # Image -> registry, CCE policy (aci-snp), release manifests. Release ids are immutable
          # once approved, so every run gets its own version.
          registry="$(terraform -chdir="${DIR}/1-platform" output -json platform | jq -r '.registry.login_server')"
          deploy/scripts/build-releases.sh --registry "${registry}" --version "2.0.0-demo.${GITHUB_RUN_ID}" \
            --families "${FAMILY}" --out-dir "${RUNNER_TEMP}/releases" --build-url "${BUILD_URL}"
          { echo "### Clean-room releases (${FAMILY})"; echo '```'; ls -1 "${RUNNER_TEMP}/releases"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/releases/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccr-releases-${{ inputs.environment }}-${{ matrix.family }}
          path: ${{ runner.temp }}/releases/
          if-no-files-found: error
          retention-days: 90
