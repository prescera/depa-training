name: Clean-room images

on:
  pull_request:
    paths: ["ccr/**", "sdk/python/**", "trainers/**", ".github/workflows/ccr-image.yml"]
  push:
    branches: [main]
    paths: ["ccr/**", "sdk/python/**", "trainers/**", ".github/workflows/ccr-image.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ccr-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: depa-ccr-${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push on main only
      id-token: write # provenance attestation on main only
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        family: [classic, torch, llm]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/depa-ccr-${{ matrix.family }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the torch/llm stacks
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        id: build
        run: |
          image="${IMAGE,,}"
          epoch="$(git log -1 --format=%ct)"
          args=(--file ccr/Dockerfile --target "${{ matrix.family }}"
                --build-arg "SOURCE_DATE_EPOCH=${epoch}"
                --label "org.opencontainers.image.revision=${GITHUB_SHA}"
                --metadata-file "${RUNNER_TEMP}/build.json"
                --provenance=mode=max --sbom=true)
          if [[ "${PUSH}" == "true" ]]; then
            args+=(--tag "${image}:main" --tag "${image}:sha-${GITHUB_SHA::12}"
                   --output "type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true")
          else
            # PRs: no registry access; keep the OCI layout (with SBOM/provenance attestations).
            args+=(--output "type=oci,dest=${RUNNER_TEMP}/image.oci.tar,rewrite-timestamp=true")
          fi
          docker buildx build "${args[@]}" .
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/build.json")"
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "### depa-ccr-${{ matrix.family }}: \`${image}@${digest}\`" >>"${GITHUB_STEP_SUMMARY}"
      - name: Smoke test
        run: |
          docker buildx build --file ccr/Dockerfile --target "${{ matrix.family }}" \
            --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" --load --tag ccr-smoke .
          docker run --rm ccr-smoke --help
          docker run --rm --entrypoint /opt/depa/trainer/bin/depa-train ccr-smoke --help
          test "$(docker image inspect ccr-smoke --format '{{json .Config.Entrypoint}}')" = '["depa-ccr","run"]'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
