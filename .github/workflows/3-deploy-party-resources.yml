name: "3 · Party resources: provider and consumer storage with SAS brokers, AKS virtual nodes for clean rooms"

# Terraform deploy/terraform/environments/azure-single-subscription/2-workloads: per provider
# (tdp-1..tdp-4, tdc) dataset storage + federation (SAS) broker with the KMS JWKS pinned, the
# consumer's output storage + broker, and the AKS virtual nodes v2 release, namespace and RBAC for
# clean rooms. Then deploys the broker code (Entra-authenticated, no basic-auth publishing).
# Needs workflow 2 (the KMS must be bootstrapped); next: workflows 4 and 5.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables (approval gate)
        type: environment
        required: true
      apply:
        description: Apply (otherwise plan only)
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        type: boolean
        default: true

permissions: {}

concurrency:
  group: azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  party-resources:
    name: Party resources (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: "Inputs: platform outputs and the KMS JWKS (pinned into every SAS broker)"
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          terraform -chdir="${DIR}/1-platform" output -json platform \
            | jq '{platform: .}' >"${DIR}/2-workloads/platform.auto.tfvars.json"
          ledger="$(jq -r '.platform.kms.ledger_name' "${DIR}/2-workloads/platform.auto.tfvars.json")"
          jwks="$(deploy/scripts/fetch-kms-jwks.sh "${ledger}")"
          jq -n --arg j "${jwks}" '{kms_jwks_json: $j}' >"${DIR}/2-workloads/broker.auto.tfvars.json"
      - name: "Clean-room cluster: remove a virtual-nodes namespace left by a failed install"
        if: inputs.apply
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}
        run: |
          # The chart creates the vn2 namespace itself. A namespace left behind by an earlier
          # failed install (Helm keeps namespaces it created on atomic rollback) makes the next
          # install fail with "exists and cannot be imported". Remove it only while the
          # virtualnode release is not installed. az aks command invoke runs kubectl inside the
          # cluster through ARM, so no API server network access is needed.
          rg="$(jq -r '.platform.compute.resource_group_name // empty' "${DIR}/2-workloads/platform.auto.tfvars.json")"
          cluster="$(jq -r '.platform.compute.cluster_name // empty' "${DIR}/2-workloads/platform.auto.tfvars.json")"
          [[ -n "${rg}" && -n "${cluster}" ]] || { echo "no clean-room cluster in this deployment"; exit 0; }
          az aks command invoke --resource-group "${rg}" --name "${cluster}" --output tsv --query logs \
            --command 'if helm status virtualnode -n default >/dev/null 2>&1; then echo "virtualnode release installed"; elif kubectl get namespace vn2 >/dev/null 2>&1; then kubectl delete namespace vn2 --wait=true; else echo "no stray vn2 namespace"; fi'
      - name: Terraform plan
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}/2-workloads
        run: |
          set -o pipefail
          terraform -chdir="${DIR}" plan -no-color -out=tfplan | tee "${RUNNER_TEMP}/plan.txt"
          { echo "### Party resources: terraform plan"; echo '```'; grep -E '^Plan:|No changes' "${RUNNER_TEMP}/plan.txt" || true; echo '```'; } \
            >>"${GITHUB_STEP_SUMMARY}"
      - name: Terraform apply
        if: inputs.apply
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}/2-workloads
        run: terraform -chdir="${DIR}" apply -no-color -auto-approve tfplan
      - name: "Providers and consumer: deploy the SAS broker code to their function apps (Entra auth)"
        if: inputs.apply
        env:
          DIR: ${{ steps.azure.outputs.deploy-dir }}/2-workloads
        run: |
          terraform -chdir="${DIR}" output -json workloads | jq '.brokers' >"${RUNNER_TEMP}/brokers.json"
          package="$(deploy/terraform/modules/azure/federation-broker/build-package.sh "${RUNNER_TEMP}/broker")"
          deploy/scripts/deploy-brokers.sh --package "${package}" --from-json "${RUNNER_TEMP}/brokers.json"
