name: Bootstrap KMS

# Builds the KMS bundle from <owner>/depa-training-kms-azure (DEPA_SERVICES_REF), installs it on its ledger
# (PUT /app/userDefinedEndpoints) and bootstraps it (`depa dc setup --step bootstrap-kms`).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions: {}

jobs:
  bootstrap:
    name: Bootstrap KMS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/depa-training-kms-azure
          ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          path: .deps/depa-training-kms-azure
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: cli
        uses: ./.github/actions/depa-cli
        with:
          environment: ${{ inputs.environment }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          party-keys: ${{ secrets.DEPA_PARTY_KEYS }}
          github-token: ${{ github.token }}
          releases: "false"
          trainer-stack-for: ""
          kubelogin: "false"
      - name: Deploy app to ledger
        run: |
          ledger="$(deploy/scripts/state-outputs.sh --account "${TFSTATE_STORAGE_ACCOUNT}" --environment "${DEPLOY_ENV}" kms | jq -er '.ledger_name')"
          deploy/scripts/deploy-services.sh --service kms --ledger "${ledger}" \
            --repo .deps/depa-training-kms-azure --out-dir "${RUNNER_TEMP}/services"
          { echo '### Bootstrap KMS'; echo '```json'; cat "${RUNNER_TEMP}/services/kms.json"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: Bootstrap
        env:
          ENV_FILE: ${{ steps.cli.outputs.env-file }}
        run: depa dc setup --env "${ENV_FILE}" --step bootstrap-kms
