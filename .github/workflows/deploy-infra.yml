name: Pilot · deploy infrastructure

# azure-pilot Terraform (deploy/terraform/environments/azure-pilot), one phase per run:
#   1-platform  -> then run "Pilot · deploy services" (bundles + DC setup)
#   2-workloads -> needs the bootstrapped KMS (its JWKS is pinned into the storage brokers)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the pilot's Azure variables (approval gate)
        type: environment
        required: true
      phase:
        description: Terraform phase
        type: choice
        options: [1-platform, 2-workloads]
        default: 1-platform
      apply:
        description: Apply (otherwise plan only)
        type: boolean
        default: false

  # Reusable from demo.yml (same inputs; `type: environment`/`choice` are dispatch-only).
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      phase:
        type: string
        default: 1-platform
      apply:
        type: boolean
        default: false
permissions: {}

concurrency:
  group: pilot-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.phase }} (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      PILOT_NAME_PREFIX: ${{ vars.PILOT_NAME_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pilot
        uses: ./.github/actions/pilot-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: Region preflight (ACL, Flex Consumption, VN2 confidential pods)
        run: deploy/scripts/check-region.sh "${AZURE_LOCATION}"
      - name: Inputs for 2-workloads (platform outputs, broker package, pinned KMS JWKS)
        if: inputs.phase == '2-workloads'
        env:
          PILOT: ${{ steps.pilot.outputs.pilot-dir }}
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          terraform -chdir="${PILOT}/1-platform" output -json pilot_platform \
            | jq '{platform: .}' >"${PILOT}/2-workloads/platform.auto.tfvars.json"
          package="$(deploy/terraform/modules/azure/federation-broker/build-package.sh "${RUNNER_TEMP}/broker")"
          ledger="$(jq -r '.platform.kms.ledger_name' "${PILOT}/2-workloads/platform.auto.tfvars.json")"
          jwks="$(deploy/scripts/fetch-kms-jwks.sh "${ledger}")"
          jq -n --arg p "${package}" --arg j "${jwks}" '{broker_package_path: $p, kms_jwks_json: $j}' \
            >"${PILOT}/2-workloads/broker.auto.tfvars.json"
      - name: Plan
        env:
          DIR: ${{ steps.pilot.outputs.pilot-dir }}/${{ inputs.phase }}
        run: |
          set -o pipefail
          terraform -chdir="${DIR}" plan -no-color -out=tfplan | tee "${RUNNER_TEMP}/plan.txt"
          { echo "### terraform plan ($(basename "${DIR}"))"; echo '```'; grep -E '^Plan:|No changes' "${RUNNER_TEMP}/plan.txt" || true; echo '```'; } \
            >>"${GITHUB_STEP_SUMMARY}"
      - name: Apply
        if: inputs.apply
        env:
          DIR: ${{ steps.pilot.outputs.pilot-dir }}/${{ inputs.phase }}
        run: terraform -chdir="${DIR}" apply -no-color -auto-approve tfplan
