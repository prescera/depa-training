name: Run Scenario

# One scenario end to end on the deployed collaborative, acting for every demo party (keys from
# the DEPA_PARTY_KEYS secret; the scenario's providers map onto tdp-1..tdp-4, its consumer onto
# tdc): register -> keys and policies -> contract signing -> training in the clean room -> model
# download and provenance. Needs "Setup Data Collab" and "Setup Training Collaborators".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scenario:
        type: string
        required: true
      platform:
        type: string
        default: aks

permissions: {}

jobs:
  register:
    name: Register collaborators and artefacts
    uses: ./.github/workflows/register-collaborators.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  keys:
    name: Keys and policies
    needs: register
    uses: ./.github/workflows/keys-and-policies.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  contract:
    name: Contract Signing
    needs: keys
    uses: ./.github/workflows/contract-signing.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  train:
    name: Model Training in CCR
    needs: contract
    uses: ./.github/workflows/model-training.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  model:
    name: Model download and provenance
    needs: train
    uses: ./.github/workflows/model-download.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit
