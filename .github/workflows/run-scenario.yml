name: Run Scenario

# One scenario end to end on the deployed collaborative, acting for every demo party (keys from
# the DEPA_PARTY_KEYS secret; the scenario's providers map onto tdp-1..tdp-4, its consumer onto
# tdc): register -> keys and policies -> contract signing -> training in the clean room -> model
# download and provenance. Needs "Setup Data Collab" and "Setup Training Collaborators" (a
# Preflight job checks their state first). resume_ccr_provider starts a paused CCR provider
# cluster before the run; pause_ccr_provider_after pauses it afterwards (also after a failure).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      depa_version:
        description: depa CLI release to install (e.g. 2.0.0); empty = build from this checkout
        type: string
        default: ""
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
      resume_ccr_provider:
        description: Start the CCR provider cluster first if it is paused
        type: boolean
        default: true
      pause_ccr_provider_after:
        description: Pause the CCR provider cluster after the run
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      depa_version:
        type: string
        default: ""
      scenario:
        type: string
        required: true
      platform:
        type: string
        default: aks

      resume_ccr_provider:
        type: boolean
        default: true
      pause_ccr_provider_after:
        type: boolean
        default: false
permissions: {}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      SCENARIO: ${{ inputs.scenario }}
      RESUME: ${{ inputs.resume_ccr_provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check deployment
        run: |
          [[ "${SCENARIO}" =~ ^[a-z0-9][a-z0-9-]*$ && -f "scenarios/${SCENARIO}/contract.yaml" ]] \
            || { echo "::error::no scenario scenarios/${SCENARIO}"; exit 1; }
          has() { [[ "$(deploy/scripts/state-outputs.sh --account "${TFSTATE_STORAGE_ACCOUNT}" --environment "${DEPLOY_ENV}" "$1")" != "{}" ]]; }
          missing=()
          for c in kms contract-service; do has "${c}" || missing+=("${c}: run Setup Data Collab first"); done
          # The scenario's providers map onto tdp-1..tdp-<n>.
          n="$(sed -n 's/^[[:space:]]*tdps:[[:space:]]*\[\(.*\)\].*/\1/p' "scenarios/${SCENARIO}/contract.yaml" | tr ',' '\n' | grep -c '[^[:space:]]' || true)"
          collaborators=(data-consumer ccr-provider-cluster ccr-provider-config)
          for i in $(seq 1 "${n:-0}"); do collaborators+=("data-provider-tdp-${i}"); done
          for c in "${collaborators[@]}"; do has "${c}" || missing+=("${c}: run Setup Training Collaborators first"); done
          if [[ ${#missing[@]} -gt 0 ]]; then
            for m in "${missing[@]}"; do echo "::error::not deployed: ${m}"; done
            exit 1
          fi
          power="$(deploy/scripts/ccr-cluster.sh --account "${TFSTATE_STORAGE_ACCOUNT}" --environment "${DEPLOY_ENV}" status)"
          if [[ "${power}" == Stopped && "${RESUME}" != true ]]; then
            echo "::error::the CCR provider cluster is paused: run Resume CCR Provider first (or set resume_ccr_provider)"; exit 1
          fi
          echo "### Preflight: ${SCENARIO} needs ${n} data provider(s); all components deployed" >>"${GITHUB_STEP_SUMMARY}"

  resume:
    name: Resume CCR Provider
    needs: preflight
    if: inputs.resume_ccr_provider
    uses: ./.github/workflows/resume-ccr-provider.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  register:
    name: Register collaborators and artefacts
    needs: [preflight, resume]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/register-collaborators.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
    secrets: inherit

  keys:
    name: Keys and policies
    needs: register
    uses: ./.github/workflows/keys-and-policies.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  contract:
    name: Contract Signing
    needs: keys
    uses: ./.github/workflows/contract-signing.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  train:
    name: Model Training in CCR
    needs: contract
    uses: ./.github/workflows/model-training.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  model:
    name: Model download and provenance
    needs: train
    uses: ./.github/workflows/model-download.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  pause:
    name: Pause CCR Provider
    needs: [preflight, model]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.pause_ccr_provider_after }}
    uses: ./.github/workflows/pause-ccr-provider.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
