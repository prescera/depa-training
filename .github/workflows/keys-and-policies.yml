name: Keys and policies

# Dataset keys and release policies in the KMS, then the encrypted data in provider storage.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      depa_version:
        description: depa CLI release to install (e.g. 2.0.0); empty = build from this checkout
        type: string
        default: ""
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      depa_version:
        type: string
        default: ""
      scenario:
        type: string
        required: true
      platform:
        type: string
        default: aks

permissions: {}

jobs:
  policies:
    name: Configure Key release policies
    uses: ./.github/workflows/configure-key-release-policies.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  data:
    name: Data/Model encryption and storage
    needs: policies
    uses: ./.github/workflows/data-encryption-storage.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      depa_version: ${{ inputs.depa_version }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit
