name: End-to-End demo

# One click: Setup Data Collab -> Setup Training Collaborators -> Run Scenario, then optionally
# Tear down (also after a failure). Every job runs in the chosen GitHub environment, whose
# protection rules (reviewers) gate it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
      skip_cleanroom_build:
        description: Skip the clean-room image build (reuse the latest release manifests)
        type: boolean
        default: false
      teardown:
        description: Tear down afterwards (also after a failure)
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scenario:
        type: string
        default: credit-risk
      platform:
        type: string
        default: aks
      skip_cleanroom_build:
        type: boolean
        default: false
      teardown:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: end-to-end-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  collab:
    name: Setup Data Collab
    uses: ./.github/workflows/setup-data-collab.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: ${{ inputs.environment }}
      skip_cleanroom_build: ${{ inputs.skip_cleanroom_build }}
    secrets: inherit

  collaborators:
    name: Setup Training Collaborators
    needs: collab
    uses: ./.github/workflows/setup-training-collaborators.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  scenario:
    name: Run Scenario
    needs: collaborators
    uses: ./.github/workflows/run-scenario.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  teardown:
    name: Tear down
    needs: [collab, collaborators, scenario]
    if: always() && inputs.teardown
    uses: ./.github/workflows/teardown.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      confirm: ${{ inputs.environment }}
    secrets: inherit
