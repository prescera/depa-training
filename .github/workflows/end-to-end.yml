name: End-to-end demo

# One click: "Set up collaborative" -> "Set up collaborators" -> "Run scenario", then optionally
# "Tear down" (also after a failure). Each is called as a reusable workflow; every job runs in the
# chosen GitHub environment, so its protection rules (reviewers) gate it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
      teardown:
        description: Tear down afterwards (also after a failure)
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scenario:
        type: string
        default: credit-risk
      platform:
        type: string
        default: aks
      teardown:
        type: boolean
        default: false

permissions: {}

# Distinct from the called workflows' groups (azure-<env>, …) so they can run inside this run.
concurrency:
  group: end-to-end-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  collaborative:
    name: Set up collaborative
    uses: ./.github/workflows/setup-collaborative.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      environment: ${{ inputs.environment }}
      apply: true
    secrets: inherit

  collaborators:
    name: Set up collaborators
    needs: collaborative
    uses: ./.github/workflows/setup-collaborators.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      apply: true
    secrets: inherit

  scenario:
    name: Run scenario
    needs: collaborators
    uses: ./.github/workflows/run-scenario.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      scenario: ${{ inputs.scenario }}
      platform: ${{ inputs.platform }}
    secrets: inherit

  teardown:
    name: Tear down
    needs: [collaborative, collaborators, scenario]
    if: always() && inputs.teardown
    uses: ./.github/workflows/teardown.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      confirm: ${{ inputs.environment }}
    secrets: inherit
