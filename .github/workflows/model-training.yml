name: Model Training in CCR

# The consumer submits the clean-room training job (AKS -> confidential ACI, or GCP Confidential
# Space) and waits for it (`--stage train`).
# Runs on a fresh runner with its own --work-dir (the stage falls back to the services when
# no earlier state is present). Only summaries and receipts are uploaded, never keys or data.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      depa_version:
        description: depa CLI release to install (e.g. 2.0.0); empty = build from this checkout
        type: string
        default: ""
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      depa_version:
        type: string
        default: ""
      scenario:
        type: string
        required: true
      platform:
        type: string
        default: aks

permissions: {}

jobs:
  stage:
    name: Model Training in CCR
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      SCENARIO: ${{ inputs.scenario }}
      PLATFORM: ${{ inputs.platform }}
      GCP_PROJECT: ${{ inputs.platform == 'gcp' && vars.GCP_PROJECT || '' }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SUBNET: ${{ vars.GCP_SUBNET }}
    steps:
      - name: Check inputs
        run: |
          [[ "${PLATFORM}" == aks || "${PLATFORM}" == gcp ]] || { echo "::error::platform must be aks or gcp"; exit 1; }
          [[ "${SCENARIO}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid scenario name"; exit 1; }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: inputs.platform == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SUBMITTER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: inputs.platform == 'gcp'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cli
        uses: ./.github/actions/depa-cli
        with:
          environment: ${{ inputs.environment }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          party-keys: ${{ secrets.DEPA_PARTY_KEYS }}
          github-token: ${{ github.token }}
          releases: "true"
          trainer-stack-for: ""
          kubelogin: "true"
          depa-version: ${{ inputs.depa_version }}
      - name: Model Training in CCR
        env:
          ENV_FILE: ${{ steps.cli.outputs.env-file }}
        run: |
          mkdir -p "${RUNNER_TEMP}/work" "${RUNNER_TEMP}/artifacts"
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${ENV_FILE}" --platform "${PLATFORM}" \
            --work-dir "${RUNNER_TEMP}/work" --stage train \
            >"${RUNNER_TEMP}/artifacts/train.json"
          { echo "### Model Training in CCR"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/train.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenario-${{ inputs.scenario }}-train-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
