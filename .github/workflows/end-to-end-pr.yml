name: End-to-End demo (PR)

# Label a pull request `run-azure-demo` to run the End-to-End demo from the PR's code (credit-risk
# on aks, then tear down). Same-repository PRs only (forks get no OIDC token or secrets); the GitHub
# environment named by the repository variable DEMO_ENVIRONMENT (required) gates each run.
on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  end-to-end:
    name: End-to-End demo
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-azure-demo') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEMO_ENVIRONMENT != ''
    uses: ./.github/workflows/end-to-end.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    with:
      environment: ${{ vars.DEMO_ENVIRONMENT }}
      scenario: credit-risk
      platform: aks
      teardown: all
    secrets: inherit
