name: Setup Data Consumer

# The data consumer tdc (Terraform root data-consumer): resource group, storage for its own dataset
# (the llm-sft base model), write-only output storage, their SAS brokers with the KMS keys pinned,
# then the broker code. Needs the bootstrapped KMS.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions: {}

concurrency:
  group: tf-${{ inputs.environment }}-data-consumer
  cancel-in-progress: false

jobs:
  consumer:
    name: Setup Data Consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tf
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          component: data-consumer
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: Pin KMS keys
        env:
          DIR: ${{ steps.tf.outputs.dir }}
        run: |
          # The SAS broker pins the KMS JWKS (TLS pinned to the KMS ledger, cross-checked with GET /info).
          ledger="$(deploy/scripts/state-outputs.sh --account "${TFSTATE_STORAGE_ACCOUNT}" --environment "${DEPLOY_ENV}" kms | jq -er '.ledger_name')"
          jq -n --arg j "$(deploy/scripts/fetch-kms-jwks.sh "${ledger}")" '{kms_jwks_json: $j}' >"${DIR}/broker.auto.tfvars.json"
      - name: Terraform plan
        env:
          DIR: ${{ steps.tf.outputs.dir }}
        run: |
          set -o pipefail
          terraform -chdir="${DIR}" plan -no-color -out=tfplan | tee "${RUNNER_TEMP}/plan.txt"
          { echo "### Data consumer: terraform plan"; echo '```'; grep -E '^Plan:|No changes' "${RUNNER_TEMP}/plan.txt" || true; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: Terraform apply
        env:
          DIR: ${{ steps.tf.outputs.dir }}
        run: terraform -chdir="${DIR}" apply -no-color -auto-approve tfplan
      - name: Deploy broker code
        env:
          DIR: ${{ steps.tf.outputs.dir }}
        run: |
          terraform -chdir="${DIR}" output -json brokers >"${RUNNER_TEMP}/brokers.json"
          package="$(deploy/terraform/modules/azure/federation-broker/build-package.sh "${RUNNER_TEMP}/broker")"
          deploy/scripts/deploy-brokers.sh --package "${package}" --from-json "${RUNNER_TEMP}/brokers.json"
