name: PR · Azure demo

# Label a pull request `run-azure-demo` to deploy the pilot from the PR's code, run credit-risk
# end to end and tear it down. Same-repository PRs only (forks get no OIDC token or secrets);
# the target GitHub environment's required reviewers approve each run.
on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  demo:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-azure-demo') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/demo.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    with:
      environment: ${{ vars.DEMO_ENVIRONMENT || 'pilot' }}
      scenario: credit-risk
      platform: aks
      teardown: true
    secrets: inherit
