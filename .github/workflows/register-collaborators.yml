name: Register collaborators and artefacts

# Registers the demo parties in the KMS and the Contract Service and approves the clean-room
# releases (`depa dc setup --step register`, idempotent).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables
        type: environment
        required: true
      depa_version:
        description: depa CLI release to install (e.g. 2.0.0); empty = build from this checkout
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      depa_version:
        type: string
        default: ""

permissions: {}

jobs:
  register:
    name: Register collaborators and artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENV: ${{ inputs.environment }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cli
        uses: ./.github/actions/depa-cli
        with:
          environment: ${{ inputs.environment }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          party-keys: ${{ secrets.DEPA_PARTY_KEYS }}
          github-token: ${{ github.token }}
          releases: "true"
          trainer-stack-for: ""
          kubelogin: "false"
          depa-version: ${{ inputs.depa_version }}
      - name: Register collaborators and artefacts
        env:
          ENV_FILE: ${{ steps.cli.outputs.env-file }}
        run: depa dc setup --env "${ENV_FILE}" --step register
