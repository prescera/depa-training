name: "5 · Run scenario: dataset keys and policies → encrypt and upload data → contract signing → clean-room training → model download"

# Runs one scenario on the deployment from workflows 1-4, acting for every demo party (keys from
# the DEPA_PARTY_KEYS secret). The scenario's own providers are mapped onto tdp-1..tdp-4 and its
# consumer onto tdc. Uploads the per-stage summaries and execution receipts.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the Azure secrets and variables (approval gate)
        type: environment
        required: true
      scenario:
        description: Scenario (scenarios/<name>)
        type: choice
        options: [credit-risk, mnist, cifar10, covid, brats, llm-sft]
        default: credit-risk
      platform:
        description: "Clean-room platform: aks (Azure confidential ACI) or gcp (Confidential Space)"
        type: choice
        options: [aks, gcp]
        default: aks
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scenario:
        type: string
        default: credit-risk
      platform:
        type: string
        default: aks

permissions: {}

concurrency:
  group: azure-${{ inputs.environment }}-scenario
  cancel-in-progress: false

jobs:
  scenario:
    name: ${{ inputs.scenario }} on ${{ inputs.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read # download the latest ccr-releases artifact
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      SCENARIO: ${{ inputs.scenario }}
      PLATFORM: ${{ inputs.platform }}
      GCP_PROJECT: ${{ inputs.platform == 'gcp' && vars.GCP_PROJECT || '' }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SUBNET: ${{ vars.GCP_SUBNET }}
    steps:
      - name: Check inputs
        run: |
          [[ "${PLATFORM}" == aks || "${PLATFORM}" == gcp ]] || { echo "::error::platform must be aks or gcp"; exit 1; }
          [[ "${SCENARIO}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid scenario name"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: azure
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          services-ref: ${{ vars.DEPA_SERVICES_REF || 'main' }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          aks-admin-group-object-id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
          deployer-object-id: ${{ secrets.DEPLOYER_OBJECT_ID }}
          tfstate-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: Check the scenario exists
        run: '[[ -f "scenarios/${SCENARIO}/contract.yaml" ]] || { echo "::error::no scenario scenarios/${SCENARIO}"; exit 1; }'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: inputs.platform == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SUBMITTER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: inputs.platform == 'gcp'
      - name: Install the depa CLI (hash-locked)
        run: |
          python -m pip install --require-hashes --no-deps -r ccr/requirements/agent.txt
          python -m pip install --no-deps ./trainers ./sdk/python
      - name: Install kubelogin (Entra-only AKS)
        run: sudo az aks install-cli --only-show-errors >/dev/null
      # Same run first (end-to-end.yml builds the images earlier in this run), else the latest
      # artifact of a standalone workflow 4 run.
      - id: releases_this_run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccr-releases-${{ inputs.environment }}
          path: ${{ runner.temp }}/releases
      - name: Clean-room release manifests from the latest workflow 4 run
        if: steps.releases_this_run.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          name="ccr-releases-${DEPLOY_ENV}"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')"
          [[ -n "${run_id}" ]] || { echo "::error::no ${name} artifact; run workflow 4 (clean-room images) first"; exit 1; }
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "${name}" --dir "${RUNNER_TEMP}/releases"
      - name: Render depa-env.yaml from the Terraform outputs; restore the party keys
        env:
          DEPA_PARTY_KEYS: ${{ secrets.DEPA_PARTY_KEYS }}
        run: |
          deploy/scripts/party-keys.sh unpack "${RUNNER_TEMP}/keys"
          mkdir -p "${RUNNER_TEMP}/releases"
          deploy/scripts/render-env.sh --parties-json "${RUNNER_TEMP}/demo-parties.json" \
            --keys-dir "${RUNNER_TEMP}/keys" --releases-dir "${RUNNER_TEMP}/releases" --out "${RUNNER_TEMP}/env/depa-env.yaml"
      - name: "DC: register parties and approve the clean-room releases in KMS and contract service (idempotent)"
        run: |
          depa dc setup --env "${RUNNER_TEMP}/env/depa-env.yaml"
          mkdir -p "${RUNNER_TEMP}/artifacts/receipts" "${RUNNER_TEMP}/work"
      - name: "Providers: create dataset keys in the KMS and set release policies"
        env:
          STAGE: keys
        run: |
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${RUNNER_TEMP}/env/depa-env.yaml" \
            --platform "${PLATFORM}" --work-dir "${RUNNER_TEMP}/work" --stage "${STAGE}"
            >"${RUNNER_TEMP}/artifacts/${STAGE}.json"
          { echo "### ${STAGE}"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/${STAGE}.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: "Providers: encrypt datasets and upload to provider storage; publish to the catalogue"
        env:
          STAGE: data
        run: |
          DEPA_STORAGE_TOKEN="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
          export DEPA_STORAGE_TOKEN
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${RUNNER_TEMP}/env/depa-env.yaml" \
            --platform "${PLATFORM}" --work-dir "${RUNNER_TEMP}/work" --stage "${STAGE}" \
            --storage-token-env DEPA_STORAGE_TOKEN --output-token-env DEPA_STORAGE_TOKEN
            >"${RUNNER_TEMP}/artifacts/${STAGE}.json"
          { echo "### ${STAGE}"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/${STAGE}.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: "Consumer: propose the contract · Providers: verify and sign"
        env:
          STAGE: contract
        run: |
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${RUNNER_TEMP}/env/depa-env.yaml" \
            --platform "${PLATFORM}" --work-dir "${RUNNER_TEMP}/work" --stage "${STAGE}"
            >"${RUNNER_TEMP}/artifacts/${STAGE}.json"
          { echo "### ${STAGE}"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/${STAGE}.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: "Consumer: run the clean-room training job (${{ inputs.platform == 'gcp' && 'GCP Confidential Space' || 'AKS → confidential ACI' }})"
        env:
          STAGE: train
        run: |
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${RUNNER_TEMP}/env/depa-env.yaml" \
            --platform "${PLATFORM}" --work-dir "${RUNNER_TEMP}/work" --stage "${STAGE}"
            >"${RUNNER_TEMP}/artifacts/${STAGE}.json"
          { echo "### ${STAGE}"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/${STAGE}.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: "Consumer: download and decrypt the model; verify execution receipts"
        env:
          STAGE: model
        run: |
          DEPA_STORAGE_TOKEN="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
          export DEPA_STORAGE_TOKEN
          set -o pipefail
          depa --json scenario deploy "${SCENARIO}" --env "${RUNNER_TEMP}/env/depa-env.yaml" \
            --platform "${PLATFORM}" --work-dir "${RUNNER_TEMP}/work" --stage "${STAGE}" \
            --storage-token-env DEPA_STORAGE_TOKEN --output-token-env DEPA_STORAGE_TOKEN
            >"${RUNNER_TEMP}/artifacts/${STAGE}.json"
          { echo "### ${STAGE}"; echo '```json'; head -c 20000 "${RUNNER_TEMP}/artifacts/${STAGE}.json"; echo; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
      - name: Collect execution receipts (never keys, plaintext data or the decrypted model)
        if: always()
        run: find "${RUNNER_TEMP}/work" -type f -iname '*receipt*' -exec cp -t "${RUNNER_TEMP}/artifacts/receipts" {} + 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenario-${{ inputs.scenario }}-${{ inputs.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
