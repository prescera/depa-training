name: azure-pilot terraform setup
description: >-
  Check out the DC service repositories (same GitHub owner), log in to Azure with GitHub OIDC,
  write the pilot tfvars (fixed demo parties) and initialise both azure-pilot phases against the
  remote state. The calling job needs `id-token: write`; Azure identifiers arrive as inputs from
  environment secrets, the region and name prefix from the env vars AZURE_LOCATION,
  AZURE_REGION_SHORT and PILOT_NAME_PREFIX (environment variables).

inputs:
  environment:
    description: GitHub environment / pilot name (state key prefix)
    required: true
  services-ref:
    description: Git ref of depa-training-kms-azure and contract-service
    required: true
  client-id:
    description: secrets.AZURE_CLIENT_ID
    required: true
  tenant-id:
    description: secrets.AZURE_TENANT_ID
    required: true
  subscription-id:
    description: secrets.AZURE_SUBSCRIPTION_ID
    required: true
  aks-admin-group-object-id:
    description: secrets.AKS_ADMIN_GROUP_OBJECT_ID
    required: true
  deployer-object-id:
    description: secrets.DEPLOYER_OBJECT_ID
    required: true
  tfstate-resource-group:
    description: secrets.TFSTATE_RESOURCE_GROUP
    required: true
  tfstate-storage-account:
    description: secrets.TFSTATE_STORAGE_ACCOUNT
    required: true

outputs:
  pilot-dir:
    description: Path of deploy/terraform/environments/azure-pilot
    value: ${{ steps.init.outputs.pilot-dir }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/depa-training-kms-azure
        ref: ${{ inputs.services-ref }}
        path: .deps/depa-training-kms-azure
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/contract-service
        ref: ${{ inputs.services-ref }}
        path: .deps/contract-service
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.16.5"
        terraform_wrapper: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
    - id: init
      shell: bash
      env:
        PILOT_ENV: ${{ inputs.environment }}
        ARM_CLIENT_ID: ${{ inputs.client-id }}
        ARM_TENANT_ID: ${{ inputs.tenant-id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        AKS_ADMIN_GROUP_OBJECT_ID: ${{ inputs.aks-admin-group-object-id }}
        DEPLOYER_OBJECT_ID: ${{ inputs.deployer-object-id }}
        TFSTATE_RESOURCE_GROUP: ${{ inputs.tfstate-resource-group }}
        TFSTATE_STORAGE_ACCOUNT: ${{ inputs.tfstate-storage-account }}
      run: |
        set -euo pipefail
        for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID AKS_ADMIN_GROUP_OBJECT_ID DEPLOYER_OBJECT_ID \
                 TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT AZURE_LOCATION AZURE_REGION_SHORT PILOT_NAME_PREFIX; do
          [[ -n "${!v:-}" ]] || { echo "::error::${v} is empty: set the environment secret/variable (deploy/README.md)"; exit 1; }
        done
        pilot="${GITHUB_WORKSPACE}/deploy/terraform/environments/azure-pilot"
        echo "pilot-dir=${pilot}" >>"${GITHUB_OUTPUT}"
        {
          echo "ARM_USE_OIDC=true"
          echo "ARM_CLIENT_ID=${ARM_CLIENT_ID}"
          echo "ARM_TENANT_ID=${ARM_TENANT_ID}"
          echo "ARM_SUBSCRIPTION_ID=${ARM_SUBSCRIPTION_ID}"
          echo "TF_IN_AUTOMATION=1"
          echo "TF_INPUT=0"
        } >>"${GITHUB_ENV}"

        # Fixed demo parties (dc-member-1, tdc, tdp-1..tdp-4); any scenario maps onto them.
        python deploy/scripts/pilot-parties.py >"${RUNNER_TEMP}/pilot-parties.json"
        runner_ip="$(curl -sSf https://api.ipify.org)"
        jq -n \
          --arg sub "${ARM_SUBSCRIPTION_ID}" --arg tenant "${ARM_TENANT_ID}" \
          --arg location "${AZURE_LOCATION}" --arg short "${AZURE_REGION_SHORT}" \
          --arg prefix "${PILOT_NAME_PREFIX}" --arg group "${AKS_ADMIN_GROUP_OBJECT_ID}" \
          --arg deployer "${DEPLOYER_OBJECT_ID}" --arg ip "${runner_ip}/32" \
          --slurpfile parties "${RUNNER_TEMP}/pilot-parties.json" \
          '{subscription_id: $sub, tenant_id: $tenant, location: $location, region_short: $short,
            name_prefix: $prefix, parties: $parties[0].parties,
            aks_admin_group_object_ids: [$group], job_submitter_object_ids: [$deployer],
            registry_pusher_object_ids: [$deployer], operator_ip_ranges: [$ip]}' \
          >"${pilot}/1-platform/pilot.auto.tfvars.json"
        jq '{parties: .parties, job_submitter_object_ids: .job_submitter_object_ids, operator_object_ids: .job_submitter_object_ids}' \
          "${pilot}/1-platform/pilot.auto.tfvars.json" >"${pilot}/2-workloads/pilot.auto.tfvars.json"

        # Local checkouts of the service stacks instead of the pinned git sources.
        DEPA_KMS_AZURE_DIR="${GITHUB_WORKSPACE}/.deps/depa-training-kms-azure" \
        DEPA_CONTRACT_SERVICE_DIR="${GITHUB_WORKSPACE}/.deps/contract-service" \
          envsubst '${DEPA_KMS_AZURE_DIR} ${DEPA_CONTRACT_SERVICE_DIR}' \
          <"${pilot}/1-platform/local_override.tf.tpl" >"${pilot}/1-platform/local_override.tf"

        for phase in 1-platform 2-workloads; do
          printf 'terraform {\n  backend "azurerm" {}\n}\n' >"${pilot}/${phase}/backend_override.tf"
          terraform -chdir="${pilot}/${phase}" init -no-color \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=depa-training/${PILOT_ENV}/${phase}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
        done

        # The pilot runs the DC Key Vaults with firewall default action Allow
        # (key_vault_network_default_action): GitHub-hosted runners have changing egress IPs, and
        # Terraform reads the vault certificates while refreshing state, before it could change
        # the firewall. Vaults created by earlier versions defaulted to Deny; set it through
        # the control plane, which the vault firewall does not cover (idempotent).
        for rg in "${PILOT_NAME_PREFIX}-dc-kms-rg" "${PILOT_NAME_PREFIX}-dc-cs-rg"; do
          [[ "$(az group exists --name "${rg}")" == "true" ]] || continue
          for kv in $(az keyvault list --resource-group "${rg}" --query "[].name" -o tsv); do
            echo "Setting Key Vault ${kv} firewall default action to Allow (pilot)"
            az keyvault update --name "${kv}" --resource-group "${rg}" --default-action Allow --output none
          done
        done
